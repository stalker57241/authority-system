name: Docker image CI build

on:
  push:
    branches: [ "general" ]
  pull_request:
    branches: [ "general" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file DockerFile --tag authoritysystem:$(date +%s)
