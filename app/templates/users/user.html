{% extends "base.html" %}
{% block title %}
    {{ username }}
{% endblock %}
{% block content %}
    <table>
        <tr>
            <td>Username:</td>
            <td>{{ user.username }}</td>
        </tr>
        <tr>
            <td>Email:</td>
            <td>{{ user.email }}</td>
        </tr>
        <tr>
            <td>Password:</td>
            <td><a href="/users/change_password">Change password</a></td>
        </tr>
    </table>
{% endblock %}
