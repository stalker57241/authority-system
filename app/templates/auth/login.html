{% extends "base.html" %}
{% block title %} Login {% endblock %}
{% block content %}
    <form method="post" action="/auth/login">
        <table class="centered" style="width: 75%;">
            <tr>
                <td>
                    <label for="email">Email:</label>
                </td>
                <td><input class="fill"  type="text" name="email" id="email"></td>
            </tr>
            <tr>
                <td><label for="password">Password:</label></td>
                <td><input class="fill" type="password" name="password" id="password"></td>
            </tr>
            <tr>
                <td colspan="2"><input type="submit" value="Login" style="width: 100%;"></td>
            </tr>
        </table>
    </form>
{% endblock %}
